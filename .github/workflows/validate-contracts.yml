name: Validate FRIDAY contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
